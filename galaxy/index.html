<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>The mathematical universe · Alphabeta Math</title>
  <meta name="description" content="Explore published mathematics as a living three-dimensional galaxy. Follow every star to a definition, theorem or proof.">
  <link rel="canonical" href="https://alphabetamath.cc/universe">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Alphabeta Math">
  <meta property="og:title" content="Mathematical Universe · Alphabeta Math">
  <meta property="og:description" content="A living galaxy of definitions, theorems and proofs. Orbit the library and discover how ideas connect.">
  <meta property="og:url" content="https://alphabetamath.cc/universe">
  <meta property="og:image" content="https://alphabetamath.cc/universe/preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Mathematical Universe, a luminous spiral galaxy of mathematical ideas">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mathematical Universe · Alphabeta Math">
  <meta name="twitter:description" content="Orbit a living galaxy of definitions, theorems and proofs.">
  <meta name="twitter:image" content="https://alphabetamath.cc/universe/preview.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ctext y='30' font-size='30' fill='%237bcaff'%3Eα%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/universe/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/universe/style.css">
</head>
<body>
  <canvas id="universe" tabindex="0" aria-label="Published mathematics dependency galaxy. Drag to orbit in 3D, Shift-drag to pan, scroll or pinch to zoom. Use the search panel to navigate items with a keyboard."></canvas>
  <nav class="tools" aria-label="Galaxy controls">
    <button id="filters-toggle" aria-label="Filter categories and find items" title="Categories & search" aria-expanded="false" aria-controls="filters"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
    <button id="highlight-toggle" aria-label="Highlight prerequisites and consumers" aria-pressed="true" title="Disable hover highlighting"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="13" cy="18" r="2"/><path d="m8 7 8-1M7 9l5 7m5-8-3 8"/><path id="highlight-off" hidden d="M3 3l18 18"/></svg></button>
    <button id="motion" aria-label="Pause rotation" title="Pause rotation" aria-pressed="false"><svg viewBox="0 0 24 24"><path id="motion-icon" d="M9 6v12M15 6v12"/></svg></button>
    <button id="reset" aria-label="Reset view" title="Reset view"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <span class="tool-divider"></span>
    <button id="zoom-out" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <button id="zoom-in" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
    <span class="tool-divider"></span>
  <div class="music-controls" aria-label="Piano music">
    <button id="music-toggle" aria-label="Play piano music" aria-pressed="false" title="Play piano music"><svg viewBox="0 0 24 24"><path d="M9 17V5l10-2v12M9 8l10-2"/><ellipse cx="6" cy="17" rx="3" ry="2"/><ellipse cx="16" cy="15" rx="3" ry="2"/><path id="music-pause" hidden d="M3 3v5M5 3v5"/></svg></button>
    <button id="music-menu" aria-label="Piano playlist and volume" aria-expanded="false" aria-controls="music-panel" title="Playlist & volume"><svg viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg></button>
  </div>
  </nav>
  <section id="filters" hidden aria-label="Explore the library">
    <div class="panel-heading"><span>Constellations</span><button id="select-all">All</button><button id="select-none">None</button></div>
    <fieldset class="highlight-mode"><legend>On hover, illuminate</legend><label><input type="radio" name="direction" value="dependencies" checked> All prerequisites</label><label><input type="radio" name="direction" value="consumers"> All downstream consumers</label></fieldset>
    <div class="legend" aria-label="Star colors"><span><i class="definition"></i>Definitions</span><span><i class="theorem"></i>Theorems</span><span><i class="example"></i>Examples</span><span><i class="remark"></i>Remarks</span></div>
    <span id="census"></span>
    <div id="categories"></div>
    <label class="search-label" for="search">Find a star</label>
    <input id="search" type="search" placeholder="Search mathematics…" autocomplete="off">
    <div id="results" aria-live="polite"></div>
  </section>
  <a id="tooltip" hidden target="_blank" rel="noopener"><span id="tip-kind"></span><strong id="tip-title"></strong><span id="tip-detail"></span><span class="tip-action">Explore item ↗</span></a>
  <div id="status" role="status">Gathering the stars…</div>
  <audio id="piano" preload="metadata"></audio>
  <section id="music-panel" hidden aria-label="Piano playlist">
    <div class="panel-heading"><span>Piano, in orbit</span><button id="music-next" aria-label="Next piano track" title="Next track">↦</button></div>
    <div id="playlist"></div>
    <label class="volume-label" for="music-volume">Volume <input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.24"></label>
    <p id="music-status" role="status"></p>
    <a class="music-credits" href="/universe/audio/credits.html" target="_blank" rel="noopener">Recordings & licenses ↗</a>
  </section>
  <script type="module" src="/universe/galaxy.js"></script>
</body>
</html>
