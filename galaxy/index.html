<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>The mathematical universe · Alphabeta Math</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ctext y='30' font-size='30' fill='%237bcaff'%3Eα%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="universe" tabindex="0" aria-label="Published mathematics dependency galaxy. Drag to orbit in 3D, Shift-drag to pan, scroll or pinch to zoom. Use the search panel to navigate items with a keyboard."></canvas>
  <header><a class="brand" href="https://alphabetamath.cc/" aria-label="Alphabeta Math">α<span>β</span></a><span class="divider"></span><span class="wordmark">THE MATHEMATICAL UNIVERSE</span></header>
  <nav class="tools" aria-label="Galaxy controls">
    <button id="filters-toggle" aria-label="Filter categories and find items" title="Categories & search" aria-expanded="false" aria-controls="filters"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
    <button id="motion" aria-label="Pause rotation" title="Pause rotation" aria-pressed="false"><svg viewBox="0 0 24 24"><path id="motion-icon" d="M9 6v12M15 6v12"/></svg></button>
    <button id="reset" aria-label="Reset view" title="Reset view"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <span class="tool-divider"></span>
    <button id="zoom-out" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <button id="zoom-in" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
  </nav>
  <section id="filters" hidden aria-label="Explore the library">
    <div class="panel-heading"><span>Constellations</span><button id="select-all">All</button><button id="select-none">None</button></div>
    <fieldset class="highlight-mode"><legend>On hover, illuminate</legend><label><input type="radio" name="direction" value="dependencies" checked> All prerequisites</label><label><input type="radio" name="direction" value="consumers"> All downstream consumers</label></fieldset>
    <div id="categories"></div>
    <label class="search-label" for="search">Find a star</label>
    <input id="search" type="search" placeholder="Search mathematics…" autocomplete="off">
    <div id="results" aria-live="polite"></div>
  </section>
  <a id="tooltip" hidden target="_blank" rel="noopener"><span id="tip-kind"></span><strong id="tip-title"></strong><span id="tip-detail"></span><span class="tip-action">Explore item ↗</span></a>
  <div id="status" role="status">Gathering the stars…</div>
  <footer>
    <div class="legend" aria-label="Star colors"><span><i class="definition"></i>Definitions</span><span><i class="theorem"></i>Theorems</span><span><i class="example"></i>Examples</span><span><i class="remark"></i>Remarks</span></div>
    <span id="census"></span>
    <span class="hint">DRAG TO ORBIT <b>·</b> SCROLL TO ZOOM</span>
  </footer>
  <script type="module" src="/galaxy.js"></script>
</body>
</html>
